name: One-time Calendar formatter
on:
  push:
    branches: [mobile/rush-mobile]
    paths: [.github/workflows/calendar-format-once.yml]
permissions:
  contents: read
jobs:
  format:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v6
        with:
          package_json_file: apps/web/package.json
          run_install: false
      - uses: actions/setup-node@v7
        with:
          node-version-file: apps/web/.node-version
          cache: pnpm
          cache-dependency-path: apps/web/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
        working-directory: apps/web
      - name: Emit Prettier-formatted calendar
        working-directory: apps/web
        run: |
          pnpm exec prettier --write src/features/calendar/index.tsx
          printf 'FORMATTED_CALENDAR_B64='
          base64 -w0 src/features/calendar/index.tsx
          printf '\n'
