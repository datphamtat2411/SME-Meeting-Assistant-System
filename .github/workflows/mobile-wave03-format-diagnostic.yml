name: Mobile Wave 03 formatter diagnostic

on:
  push:
    branches:
      - mobile/module-meeting-results
    paths:
      - .github/workflows/mobile-wave03-format-diagnostic.yml

permissions:
  contents: read

jobs:
  format-diagnostic:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: apps/mobile
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Read pinned Flutter version
        id: pin
        run: |
          python3 -c 'import json; print("version=" + json.load(open(".fvmrc"))["flutter"])' >> "$GITHUB_OUTPUT"
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ steps.pin.outputs.version }}
          channel: stable
          cache: true
      - name: Print exact formatter output for changed files
        run: |
          dart --version
          dart format lib test
          python3 - <<'PY'
          import base64
          import pathlib
          import subprocess
          for name in subprocess.check_output(["git", "diff", "--name-only", "--relative", "--", "lib", "test"], text=True).splitlines():
              data = base64.b64encode(pathlib.Path(name).read_bytes()).decode("ascii")
              for offset in range(0, len(data), 3000):
                  print(f"FORMAT_RESULT {name} {offset} {data[offset:offset+3000]}")
          PY
      - name: Verify dependency lock
        run: flutter pub get --enforce-lockfile
      - name: Analyze formatted source
        run: flutter analyze
      - name: Run focused Results tests
        run: flutter test test/results_contract_test.dart test/results_workspace_regression_test.dart --reporter expanded
