name: AI CI

on:
  push:
    branches:
      - develop
      - 'ai/**'
      - 'api/**'
      - 'integration/**'
    paths:
      - 'services/ai/**'
      - 'services/api/**'
      - 'contracts/CORE_API_AI_TRANSCRIPTION_WORKER_V1.md'
      - '.github/workflows/ai-ci.yml'
  pull_request:
    branches:
      - develop
      - 'ai/**'
      - 'integration/**'
    paths:
      - 'services/ai/**'
      - 'services/api/**'
      - 'contracts/CORE_API_AI_TRANSCRIPTION_WORKER_V1.md'
      - '.github/workflows/ai-ci.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ai-verify:
    name: AI verification
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    defaults:
      run:
        working-directory: services/ai

    steps:
      - name: Check out source
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Java 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version-file: services/ai/.python-version

      - name: Set up uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          cache-dependency-glob: services/ai/uv.lock

      - name: Synchronize dependencies
        run: uv sync --locked

      - name: Install and check audio decoder tools
        run: |
          if ! command -v ffmpeg >/dev/null 2>&1 || ! command -v ffprobe >/dev/null 2>&1; then
            sudo apt-get \
              -o Acquire::Retries=3 \
              -o Acquire::http::Timeout=60 \
              -o Acquire::https::Timeout=60 \
              update
            sudo env DEBIAN_FRONTEND=noninteractive apt-get \
              -o Acquire::Retries=3 \
              -o Acquire::http::Timeout=60 \
              -o Acquire::https::Timeout=60 \
              install --yes --no-install-recommends ffmpeg
          fi
          ffmpeg -version
          ffprobe -version

      - name: Lint AI package
        run: uv run ruff check src tests

      - name: Test AI package
        run: uv run pytest tests

      - name: Build wheel and source distribution
        run: uv build

      - name: Build locked runtime image
        run: docker build --tag sme-ai:smoke .

      - name: Smoke test independent runtime roles
        run: uv run python tests/container_smoke.py
