name: M05 pinned Dart formatter diagnostic
on:
  push:
    branches:
      - mobile/module-meeting-results
permissions:
  contents: read
jobs:
  formatter:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: apps/mobile
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - id: pin
        run: echo "version=$(python3 -c 'import json; print(json.load(open(".fvmrc"))["flutter"])')" >> "$GITHUB_OUTPUT"
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ steps.pin.outputs.version }}
          channel: stable
          cache: true
      - run: flutter pub get --enforce-lockfile
      - name: Print exact formatting patch
        run: |
          dart format lib/features/results/decision_review_state.dart test/results_workspace_regression_test.dart
          git diff -- lib/features/results/decision_review_state.dart test/results_workspace_regression_test.dart
