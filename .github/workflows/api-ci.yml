name: API CI

on:
  push:
    branches:
      - develop
      - 'api/**'
      - 'integration/**'
  pull_request:
    branches:
      - develop
      - 'api/**'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  api-verify:
    name: API verification
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: services/api

    steps:
      - name: Check out source
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Validate PI-01 inventory and negative tests
        run: |
          python3 scripts/verify_pi01_inventory.py
          python3 -m unittest discover -s scripts -p 'test_verify_pi01_inventory.py' -v

      - name: Set up Java 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
          cache-dependency-path: |
            services/api/pom.xml
            services/api/.mvn/wrapper/maven-wrapper.properties

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version-file: services/ai/.python-version

      - name: Set up uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          cache-dependency-glob: services/ai/uv.lock

      - name: Synchronize locked AI dependencies
        run: uv sync --locked
        working-directory: services/ai

      - name: Verify Docker
        run: docker info

      - name: Install and check media validation tools
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends ffmpeg
          ffmpeg -version
          ffprobe -version

      - name: Verify API
        run: ./mvnw -B -ntp verify
