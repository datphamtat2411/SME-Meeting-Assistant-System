name: M06 Temporary Verification
on:
  push:
    branches:
      - 'mobile/module-action-items'
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: apps/mobile
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Read Flutter pin
        id: pin
        run: |
          python3 -c 'import json; print("version="+json.load(open(".fvmrc"))["flutter"])' >> "$GITHUB_OUTPUT"
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ steps.pin.outputs.version }}
          channel: stable
          cache: true
      - run: flutter pub get --enforce-lockfile
      - name: Produce canonical formatter diff
        run: |
          dart format lib test
          git diff -- lib test
      - name: Analyze
        run: flutter analyze
      - name: Focused tests
        run: flutter test test/action_item_collection_test.dart test/action_item_management_test.dart test/action_item_widgets_test.dart
