name: PI Integration CI

on:
  push:
    branches:
      - 'api/**'
    paths:
      - 'services/api/**'
      - 'requirement-docs/**'
      - '.github/workflows/pi-integration-ci.yml'
  pull_request:
    branches:
      - develop
      - 'api/**'
    paths:
      - 'services/api/**'
      - 'requirement-docs/**'
      - '.github/workflows/pi-integration-ci.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pi-regressions:
    name: PI-02 and PI-03 PostgreSQL regression gate
    runs-on: ubuntu-latest
    timeout-minutes: 25
    defaults:
      run:
        working-directory: services/api
    steps:
      - name: Check out source
        uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Set up Java 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
          cache-dependency-path: |
            services/api/pom.xml
            services/api/.mvn/wrapper/maven-wrapper.properties
      - name: Verify Docker for PostgreSQL Testcontainers
        run: docker info
      - name: Run Assistant and cross-module regression suites
        run: >
          ./mvnw -B -ntp
          -Dtest=AssistantHttpIntegrationTests,CrossModuleRevisionConsistencyIntegrationTests
          test
