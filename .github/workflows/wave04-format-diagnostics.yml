name: Wave 04 formatter diagnostics
on:
  push:
    branches:
      - mobile/module-action-items
permissions:
  contents: read
jobs:
  diagnostics:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: apps/mobile
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Read Flutter pin
        id: pin
        run: |
          echo "version=$(python3 -c 'import json; print(json.load(open(".fvmrc"))["flutter"])')" >> "$GITHUB_OUTPUT"
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ steps.pin.outputs.version }}
          channel: stable
          cache: true
      - name: Format and emit source-only diff
        run: |
          dart format lib test
          git diff --no-color -- lib test
      - name: Resolve dependencies
        run: flutter pub get --enforce-lockfile
      - name: Analyze
        run: flutter analyze
      - name: Run Wave 04 focused tests
        run: flutter test test/action_item_collection_test.dart test/action_item_management_test.dart test/app_dependencies_test.dart test/dashboard_action_item_integration_test.dart test/results_workspace_regression_test.dart --reporter=expanded --timeout=2m
