name: sme_meeting_assistant
description: SME Meeting Assistant mobile client for internal meetings.
publish_to: none
version: 0.1.0+1

environment:
  sdk: '>=3.14.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  crypto: ^3.0.8
  flutter_secure_storage: ^11.2.0
  http: ^1.3.0
  intl: ^0.20.2
  shared_preferences: ^2.5.3
  file_picker: 13.3.2
  path: ^1.9.1
  record: ^6.0.0
  path_provider: ^2.1.5
  sqflite: ^2.4.2

dev_dependencies:
  flutter_lints: ^5.0.0
  flutter_test:
    sdk: flutter
  sqflite_common_ffi: ^2.3.5

flutter:
  uses-material-design: true
