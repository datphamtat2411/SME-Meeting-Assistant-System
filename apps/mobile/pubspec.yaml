name: sme_meeting_assistant
description: SME Meeting Assistant mobile client for internal meetings.
publish_to: none
version: 0.1.0+1

environment:
  sdk: '>=3.10.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_secure_storage: ^9.2.4
  http: ^1.3.0
  intl: ^0.20.2
  shared_preferences: ^2.5.3
  file_picker: 13.3.2
  record: ^6.0.0
  path_provider: ^2.1.5

dev_dependencies:
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
