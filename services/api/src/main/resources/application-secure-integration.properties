# Opt-in only: --spring.profiles.active=secure-integration
app.transport.private.enabled=true
app.transport.ai.enabled=true
spring.rabbitmq.port=${RABBITMQ_PORT:5671}
spring.rabbitmq.virtual-host=${RABBITMQ_VIRTUAL_HOST}
spring.rabbitmq.ssl.enabled=true
spring.rabbitmq.ssl.bundle=integration-broker
spring.rabbitmq.ssl.validate-server-certificate=true
spring.rabbitmq.ssl.verify-hostname=true
spring.ssl.bundle.pem.integration-broker.truststore.certificate=file:${RABBITMQ_CA_FILE}
spring.ssl.bundle.pem.integration-broker.options.enabled-protocols=TLSv1.3,TLSv1.2
app.media.storage.endpoint=${APP_MEDIA_STORAGE_ENDPOINT}
app.media.storage.ca-file=${APP_MEDIA_STORAGE_CA_FILE}
# E2E-01 does not enable business dispatch/receivers or provision queue topology.
app.media.outbox.enabled=false
app.worker.transcription.enabled=false
app.media.messaging.topology=external-quorum
spring.rabbitmq.dynamic=false
# Explicit operational activation after broker/storage verification.
app.worker.dead-letter.enabled=${APP_WORKER_DEAD_LETTER_ENABLED:false}
app.worker.dead-letter.username=${RABBITMQ_RECONCILER_USERNAME:}
app.worker.dead-letter.password=${RABBITMQ_RECONCILER_PASSWORD:}
app.worker.transcription.infrastructure-verified=${APP_WORKER_TRANSCRIPTION_INFRASTRUCTURE_VERIFIED:false}
