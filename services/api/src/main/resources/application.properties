spring.application.name=${APP_NAME:meeting-assistant-api}

app.runtime.environment=${APP_ENVIRONMENT:}
app.runtime.request-id.trusted-proxies=${APP_RUNTIME_REQUEST_ID_TRUSTED_PROXIES:}

spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.hikari.maximum-pool-size=${DB_POOL_MAX_SIZE:10}
spring.datasource.hikari.minimum-idle=${DB_POOL_MIN_IDLE:2}
spring.datasource.hikari.connection-timeout=${DB_POOL_CONNECTION_TIMEOUT_MS:30000}
spring.datasource.hikari.validation-timeout=${DB_POOL_VALIDATION_TIMEOUT_MS:5000}
spring.datasource.hikari.max-lifetime=${DB_POOL_MAX_LIFETIME_MS:1800000}

spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.validate-on-migrate=true
spring.flyway.validate-migration-naming=true
spring.flyway.baseline-on-migrate=false
spring.flyway.out-of-order=false
spring.flyway.fail-on-missing-locations=true
spring.flyway.clean-disabled=true

spring.jpa.hibernate.ddl-auto=none
spring.jpa.generate-ddl=false
spring.jpa.open-in-view=false
spring.sql.init.mode=never

springdoc.paths-to-match=/api/v1/**
springdoc.api-docs.enabled=false
springdoc.swagger-ui.enabled=false

app.http.security.cors.allowed-origins=${APP_HTTP_SECURITY_CORS_ALLOWED_ORIGINS:}
app.http.security.cors.allowed-methods=${APP_HTTP_SECURITY_CORS_ALLOWED_METHODS:GET,HEAD,POST,PUT,PATCH,DELETE,OPTIONS}
app.http.security.cors.allowed-headers=${APP_HTTP_SECURITY_CORS_ALLOWED_HEADERS:Accept,Content-Type,Authorization,X-CSRF-Token,Idempotency-Key,If-Match,X-Request-Id,X-Auth-Transport}
app.http.security.cors.exposed-headers=${APP_HTTP_SECURITY_CORS_EXPOSED_HEADERS:ETag,Location,X-Request-Id}
app.http.security.cors.allow-credentials=${APP_HTTP_SECURITY_CORS_ALLOW_CREDENTIALS:true}
app.http.security.cors.max-age=${APP_HTTP_SECURITY_CORS_MAX_AGE:600s}
app.http.security.hsts.enabled=${APP_HTTP_SECURITY_HSTS_ENABLED:false}
app.http.security.hsts.max-age=${APP_HTTP_SECURITY_HSTS_MAX_AGE:31536000s}
app.http.security.hsts.include-subdomains=${APP_HTTP_SECURITY_HSTS_INCLUDE_SUBDOMAINS:true}
app.http.security.hsts.trusted-proxies=${APP_HTTP_SECURITY_HSTS_TRUSTED_PROXIES:}

logging.structured.format.console=logstash

management.endpoint.health.probes.enabled=true
management.endpoint.health.show-details=never
management.endpoint.health.group.liveness.include=livenessState
management.endpoint.health.group.readiness.include=readinessState,db
management.endpoints.web.exposure.include=health

# Setup-token HMAC secret is a separate Base64-encoded 32+ byte deployment secret.
app.account-setup.signing-key=${APP_ACCOUNT_SETUP_SIGNING_KEY:}
app.account-setup.setup-url=${APP_ACCOUNT_SETUP_URL:}
app.account-setup.sender=${APP_ACCOUNT_SETUP_SENDER:}
app.account-setup.worker-enabled=${APP_ACCOUNT_SETUP_WORKER_ENABLED:true}
spring.mail.port=${SPRING_MAIL_PORT:587}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true
spring.mail.properties.mail.smtp.ssl.checkserveridentity=true
spring.mail.properties.mail.smtp.connectiontimeout=10000
spring.mail.properties.mail.smtp.timeout=10000
spring.mail.properties.mail.smtp.writetimeout=10000

# P4-T03: RS256 key material comes from read-only trusted file/classpath locations.
# Never use a generated or implicit default signing secret in production.
app.auth.jwt.private-key-location=${APP_AUTH_JWT_PRIVATE_KEY_LOCATION:}
app.auth.jwt.public-key-location=${APP_AUTH_JWT_PUBLIC_KEY_LOCATION:}
app.auth.jwt.key-id=${APP_AUTH_JWT_KEY_ID:}
app.auth.jwt.previous-public-key-location=${APP_AUTH_JWT_PREVIOUS_PUBLIC_KEY_LOCATION:}
app.auth.jwt.previous-key-id=${APP_AUTH_JWT_PREVIOUS_KEY_ID:}
app.auth.jwt.issuer=${APP_AUTH_JWT_ISSUER:}
app.auth.jwt.audience=${APP_AUTH_JWT_AUDIENCE:}
app.auth.jwt.access-ttl=PT10M
app.auth.jwt.clock-skew=PT30S

# P4-T05 HTTP transport remains disabled until P4-T07 login/refresh abuse controls.
app.auth.transport.enabled=${APP_AUTH_TRANSPORT_ENABLED:false}
# Distinct HMAC key; provision 32+ CSPRNG bytes, Base64 encoded (never reuse JWT/setup key).
app.auth.csrf.signing-key=${APP_AUTH_CSRF_SIGNING_KEY:}

# One transactional SMTP worker shared with account setup and password recovery.
app.email.delivery.sender=${APP_EMAIL_DELIVERY_SENDER:${app.account-setup.sender:}}
app.email.delivery.worker-enabled=${APP_EMAIL_DELIVERY_WORKER_ENABLED:${app.account-setup.worker-enabled:true}}
app.email.delivery.poll-delay-ms=${APP_EMAIL_DELIVERY_POLL_DELAY_MS:30000}

# Media source objects are private; clients receive short-lived upload/download capabilities.
app.media.storage.endpoint=${APP_MEDIA_STORAGE_ENDPOINT:http://localhost:9000}
app.media.storage.region=${APP_MEDIA_STORAGE_REGION:us-east-1}
app.media.storage.bucket=${APP_MEDIA_STORAGE_BUCKET:meeting-media}
app.media.storage.access-key=${APP_MEDIA_STORAGE_ACCESS_KEY:}
app.media.storage.secret-key=${APP_MEDIA_STORAGE_SECRET_KEY:}
app.media.storage.path-style-access=${APP_MEDIA_STORAGE_PATH_STYLE_ACCESS:true}
app.media.storage.create-bucket-if-missing=${APP_MEDIA_STORAGE_CREATE_BUCKET_IF_MISSING:false}
app.media.upload.allowed-extensions=${APP_MEDIA_UPLOAD_ALLOWED_EXTENSIONS:}
app.media.upload.allowed-content-types=${APP_MEDIA_UPLOAD_ALLOWED_CONTENT_TYPES:}
app.media.upload.max-size-bytes=${APP_MEDIA_UPLOAD_MAX_SIZE_BYTES:0}
app.media.upload.max-duration-ms=${APP_MEDIA_UPLOAD_MAX_DURATION_MS:0}
app.media.upload.ffprobe-path=${APP_MEDIA_UPLOAD_FFPROBE_PATH:ffprobe}
app.media.upload.probe-timeout=${APP_MEDIA_UPLOAD_PROBE_TIMEOUT:PT30S}
app.media.upload.upload-url-ttl=${APP_MEDIA_UPLOAD_URL_TTL:PT15M}
app.media.upload.download-url-ttl=${APP_MEDIA_DOWNLOAD_URL_TTL:PT5M}
# T04: transactional PostgreSQL-backed media/AI admission limits.
app.media.admission.max-jobs-per-window=${APP_MEDIA_ADMISSION_MAX_JOBS_PER_WINDOW:12}
app.media.admission.job-window-minutes=${APP_MEDIA_ADMISSION_JOB_WINDOW_MINUTES:60}
app.media.admission.max-active-jobs-per-user=${APP_MEDIA_ADMISSION_MAX_ACTIVE_JOBS_PER_USER:3}
app.media.admission.max-pending-uploads-per-user=${APP_MEDIA_ADMISSION_MAX_PENDING_UPLOADS_PER_USER:5}
app.media.outbox.exchange=${APP_MEDIA_OUTBOX_EXCHANGE:meeting.processing}
app.media.outbox.routing-key=${APP_MEDIA_OUTBOX_ROUTING_KEY:processing.job.queued}
app.media.outbox.poll-delay-ms=${APP_MEDIA_OUTBOX_POLL_DELAY_MS:2000}
app.media.outbox.max-attempts=${APP_MEDIA_OUTBOX_MAX_ATTEMPTS:12}
app.media.outbox.lease-seconds=${APP_MEDIA_OUTBOX_LEASE_SECONDS:60}
app.media.outbox.confirm-timeout-seconds=${APP_MEDIA_OUTBOX_CONFIRM_TIMEOUT_SECONDS:10}
app.media.outbox.enabled=${APP_MEDIA_OUTBOX_ENABLED:true}
app.media.processing.max-retries=${APP_MEDIA_PROCESSING_MAX_RETRIES:0}
spring.rabbitmq.host=${RABBITMQ_HOST:localhost}
spring.rabbitmq.port=${RABBITMQ_PORT:5672}
spring.rabbitmq.username=${RABBITMQ_USERNAME:}
spring.rabbitmq.password=${RABBITMQ_PASSWORD:}
spring.rabbitmq.publisher-confirm-type=correlated
spring.rabbitmq.publisher-returns=true
spring.rabbitmq.template.mandatory=true

# P4-T06. Recovery endpoints require explicit rollout approval; separate from login transport.
app.auth.recovery.enabled=${APP_AUTH_RECOVERY_ENABLED:false}
app.auth.recovery.signing-key=${APP_AUTH_RECOVERY_SIGNING_KEY:}
app.auth.recovery.reset-url=${APP_AUTH_RECOVERY_RESET_URL:}

# P4-T07: server-shared rate limits; transport remains explicitly opt-in.
# A separate deployment secret HMACs source/account/credential fingerprints.
app.auth.abuse.hashing-key=${APP_AUTH_ABUSE_HASHING_KEY:}
app.auth.abuse.trusted-proxies=${APP_AUTH_ABUSE_TRUSTED_PROXIES:}
app.auth.abuse.login-ip-limit=${APP_AUTH_ABUSE_LOGIN_IP_LIMIT:30}
app.auth.abuse.login-window-seconds=${APP_AUTH_ABUSE_LOGIN_WINDOW_SECONDS:600}
app.auth.abuse.login-pair-threshold=${APP_AUTH_ABUSE_LOGIN_PAIR_THRESHOLD:3}
app.auth.abuse.login-pair-max-delay-seconds=${APP_AUTH_ABUSE_LOGIN_PAIR_MAX_DELAY_SECONDS:300}
app.auth.abuse.refresh-ip-limit=${APP_AUTH_ABUSE_REFRESH_IP_LIMIT:60}
app.auth.abuse.refresh-window-seconds=${APP_AUTH_ABUSE_REFRESH_WINDOW_SECONDS:600}
app.auth.abuse.refresh-credential-limit=${APP_AUTH_ABUSE_REFRESH_CREDENTIAL_LIMIT:12}
app.auth.abuse.refresh-credential-window-seconds=${APP_AUTH_ABUSE_REFRESH_CREDENTIAL_WINDOW_SECONDS:60}
