spring.application.name=${APP_NAME:meeting-assistant-api}

app.runtime.environment=${APP_ENVIRONMENT:}
app.runtime.request-id.trusted-proxies=${APP_RUNTIME_REQUEST_ID_TRUSTED_PROXIES:}

app.media.storage.enabled=${MEDIA_STORAGE_ENABLED:false}
app.media.storage.endpoint=${MEDIA_STORAGE_ENDPOINT:}
app.media.storage.access-key=${MEDIA_STORAGE_ACCESS_KEY:}
app.media.storage.secret-key=${MEDIA_STORAGE_SECRET_KEY:}
app.media.storage.bucket=${MEDIA_STORAGE_BUCKET:meeting-media}
app.media.max-upload-size=${MEDIA_MAX_UPLOAD_SIZE:100MB}
app.media.messaging.enabled=${MEDIA_MESSAGING_ENABLED:false}
app.media.messaging.exchange=${MEDIA_MESSAGING_EXCHANGE:media.processing}
app.media.messaging.queue=${MEDIA_MESSAGING_QUEUE:media.processing.jobs}
app.media.messaging.routing-key=${MEDIA_MESSAGING_ROUTING_KEY:processing.job.requested}
app.media.messaging.poll-delay-ms=${MEDIA_MESSAGING_POLL_DELAY_MS:1000}

spring.servlet.multipart.max-file-size=${MEDIA_MAX_UPLOAD_SIZE:100MB}
spring.servlet.multipart.max-request-size=${MEDIA_MAX_REQUEST_SIZE:110MB}
spring.rabbitmq.host=${RABBITMQ_HOST:localhost}
spring.rabbitmq.port=${RABBITMQ_PORT:5672}
spring.rabbitmq.username=${RABBITMQ_USERNAME:${RABBITMQ_DEFAULT_USER:guest}}
spring.rabbitmq.password=${RABBITMQ_PASSWORD:${RABBITMQ_DEFAULT_PASS:guest}}
spring.rabbitmq.publisher-confirm-type=correlated
spring.rabbitmq.publisher-returns=true
spring.rabbitmq.template.mandatory=true

spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.hikari.maximum-pool-size=${DB_POOL_MAX_SIZE:10}
spring.datasource.hikari.minimum-idle=${DB_POOL_MIN_IDLE:2}
spring.datasource.hikari.connection-timeout=${DB_POOL_CONNECTION_TIMEOUT_MS:30000}
spring.datasource.hikari.validation-timeout=${DB_POOL_VALIDATION_TIMEOUT_MS:5000}
spring.datasource.hikari.max-lifetime=${DB_POOL_MAX_LIFETIME_MS:1800000}

spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.validate-on-migrate=true
spring.flyway.validate-migration-naming=true
spring.flyway.baseline-on-migrate=false
spring.flyway.out-of-order=false
spring.flyway.fail-on-missing-locations=true
spring.flyway.clean-disabled=true

spring.jpa.hibernate.ddl-auto=none
spring.jpa.generate-ddl=false
spring.jpa.open-in-view=false
spring.sql.init.mode=never

springdoc.paths-to-match=/api/v1/**
springdoc.api-docs.enabled=false
springdoc.swagger-ui.enabled=false

app.http.security.cors.allowed-origins=${APP_HTTP_SECURITY_CORS_ALLOWED_ORIGINS:}
app.http.security.cors.allowed-methods=${APP_HTTP_SECURITY_CORS_ALLOWED_METHODS:GET,HEAD,POST,PUT,PATCH,DELETE,OPTIONS}
app.http.security.cors.allowed-headers=${APP_HTTP_SECURITY_CORS_ALLOWED_HEADERS:Accept,Content-Type,Authorization,X-CSRF-Token,Idempotency-Key,If-Match,X-Request-Id}
app.http.security.cors.exposed-headers=${APP_HTTP_SECURITY_CORS_EXPOSED_HEADERS:ETag,Location,X-Request-Id}
app.http.security.cors.allow-credentials=${APP_HTTP_SECURITY_CORS_ALLOW_CREDENTIALS:true}
app.http.security.cors.max-age=${APP_HTTP_SECURITY_CORS_MAX_AGE:600s}
app.http.security.hsts.enabled=${APP_HTTP_SECURITY_HSTS_ENABLED:false}
app.http.security.hsts.max-age=${APP_HTTP_SECURITY_HSTS_MAX_AGE:31536000s}
app.http.security.hsts.include-subdomains=${APP_HTTP_SECURITY_HSTS_INCLUDE_SUBDOMAINS:true}
app.http.security.hsts.trusted-proxies=${APP_HTTP_SECURITY_HSTS_TRUSTED_PROXIES:}

logging.structured.format.console=logstash

management.endpoint.health.probes.enabled=true
management.endpoint.health.show-details=never
management.endpoint.health.group.liveness.include=livenessState
management.endpoint.health.group.readiness.include=readinessState,db
management.endpoints.web.exposure.include=health
