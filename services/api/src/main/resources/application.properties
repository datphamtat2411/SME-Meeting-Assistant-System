spring.application.name=${APP_NAME:meeting-assistant-api}

app.runtime.environment=${APP_ENVIRONMENT:}
app.runtime.request-id.trusted-proxies=${APP_RUNTIME_REQUEST_ID_TRUSTED_PROXIES:}

spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.hikari.maximum-pool-size=${DB_POOL_MAX_SIZE:10}
spring.datasource.hikari.minimum-idle=${DB_POOL_MIN_IDLE:2}
spring.datasource.hikari.connection-timeout=${DB_POOL_CONNECTION_TIMEOUT_MS:30000}
spring.datasource.hikari.validation-timeout=${DB_POOL_VALIDATION_TIMEOUT_MS:5000}
spring.datasource.hikari.max-lifetime=${DB_POOL_MAX_LIFETIME_MS:1800000}

spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.validate-on-migrate=true
spring.flyway.validate-migration-naming=true
spring.flyway.baseline-on-migrate=false
spring.flyway.out-of-order=false
spring.flyway.fail-on-missing-locations=true
spring.flyway.clean-disabled=true

spring.jpa.hibernate.ddl-auto=none
spring.jpa.generate-ddl=false
spring.jpa.open-in-view=false
spring.sql.init.mode=never

springdoc.paths-to-match=/api/v1/**
springdoc.api-docs.enabled=false
springdoc.swagger-ui.enabled=false

app.http.security.cors.allowed-origins=${APP_HTTP_SECURITY_CORS_ALLOWED_ORIGINS:}
app.http.security.cors.allowed-methods=${APP_HTTP_SECURITY_CORS_ALLOWED_METHODS:GET,HEAD,POST,PUT,PATCH,DELETE,OPTIONS}
app.http.security.cors.allowed-headers=${APP_HTTP_SECURITY_CORS_ALLOWED_HEADERS:Accept,Content-Type,Authorization,X-CSRF-Token,Idempotency-Key,If-Match,X-Request-Id,X-Auth-Transport}
app.http.security.cors.exposed-headers=${APP_HTTP_SECURITY_CORS_EXPOSED_HEADERS:ETag,Location,X-Request-Id}
app.http.security.cors.allow-credentials=${APP_HTTP_SECURITY_CORS_ALLOW_CREDENTIALS:true}
app.http.security.cors.max-age=${APP_HTTP_SECURITY_CORS_MAX_AGE:600s}
app.http.security.hsts.enabled=${APP_HTTP_SECURITY_HSTS_ENABLED:false}
app.http.security.hsts.max-age=${APP_HTTP_SECURITY_HSTS_MAX_AGE:31536000s}
app.http.security.hsts.include-subdomains=${APP_HTTP_SECURITY_HSTS_INCLUDE_SUBDOMAINS:true}
app.http.security.hsts.trusted-proxies=${APP_HTTP_SECURITY_HSTS_TRUSTED_PROXIES:}

logging.structured.format.console=logstash

management.endpoint.health.probes.enabled=true
management.endpoint.health.show-details=never
management.endpoint.health.group.liveness.include=livenessState
management.endpoint.health.group.readiness.include=readinessState,db
management.endpoints.web.exposure.include=health

# Setup-token HMAC secret is a separate Base64-encoded 32+ byte deployment secret.
app.account-setup.signing-key=${APP_ACCOUNT_SETUP_SIGNING_KEY:}
app.account-setup.setup-url=${APP_ACCOUNT_SETUP_URL:}
app.account-setup.sender=${APP_ACCOUNT_SETUP_SENDER:}
app.account-setup.worker-enabled=${APP_ACCOUNT_SETUP_WORKER_ENABLED:true}
spring.mail.port=${SPRING_MAIL_PORT:587}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true
spring.mail.properties.mail.smtp.ssl.checkserveridentity=true
spring.mail.properties.mail.smtp.connectiontimeout=10000
spring.mail.properties.mail.smtp.timeout=10000
spring.mail.properties.mail.smtp.writetimeout=10000

# P4-T03: RS256 key material comes from read-only trusted file/classpath locations.
# Never use a generated or implicit default signing secret in production.
app.auth.jwt.private-key-location=${APP_AUTH_JWT_PRIVATE_KEY_LOCATION:}
app.auth.jwt.public-key-location=${APP_AUTH_JWT_PUBLIC_KEY_LOCATION:}
app.auth.jwt.key-id=${APP_AUTH_JWT_KEY_ID:}
app.auth.jwt.previous-public-key-location=${APP_AUTH_JWT_PREVIOUS_PUBLIC_KEY_LOCATION:}
app.auth.jwt.previous-key-id=${APP_AUTH_JWT_PREVIOUS_KEY_ID:}
app.auth.jwt.issuer=${APP_AUTH_JWT_ISSUER:}
app.auth.jwt.audience=${APP_AUTH_JWT_AUDIENCE:}
app.auth.jwt.access-ttl=PT10M
app.auth.jwt.clock-skew=PT30S

# P4-T05 HTTP transport remains disabled until P4-T07 login/refresh abuse controls.
app.auth.transport.enabled=${APP_AUTH_TRANSPORT_ENABLED:false}
# Distinct HMAC key; provision 32+ CSPRNG bytes, Base64 encoded (never reuse JWT/setup key).
app.auth.csrf.signing-key=${APP_AUTH_CSRF_SIGNING_KEY:}
