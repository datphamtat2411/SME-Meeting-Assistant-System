app.runtime.environment=test
app.runtime.request-id.trusted-proxies=127.0.0.1

spring.application.name=meeting-assistant-api
logging.structured.format.console=logstash

management.endpoint.health.probes.enabled=true
management.endpoint.health.show-details=never

app.http.security.cors.allowed-origins=http://localhost:3000
springdoc.api-docs.enabled=true
springdoc.swagger-ui.enabled=false

app.account-setup.signing-key=AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=
app.account-setup.setup-url=https://example.invalid/setup
app.account-setup.sender=test-sender@example.invalid
app.account-setup.worker-enabled=false

# Public TEST-ONLY RSA key fixtures; never deploy these keys or properties.
app.auth.jwt.private-key-location=classpath:auth/test-current-private.pem
app.auth.jwt.public-key-location=classpath:auth/test-current-public.pem
app.auth.jwt.key-id=test-current-2026
app.auth.jwt.previous-public-key-location=classpath:auth/test-previous-public.pem
app.auth.jwt.previous-key-id=test-previous-2026
app.auth.jwt.issuer=https://issuer.test.invalid
app.auth.jwt.audience=sme-core-api-test

# Test-only CSRF key; never deploy the fixture.
app.auth.csrf.signing-key=AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=
