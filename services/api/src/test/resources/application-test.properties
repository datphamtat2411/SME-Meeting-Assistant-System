app.runtime.environment=test
app.runtime.request-id.trusted-proxies=127.0.0.1

spring.application.name=meeting-assistant-api
logging.structured.format.console=logstash

management.endpoint.health.probes.enabled=true
management.endpoint.health.show-details=never

app.http.security.cors.allowed-origins=http://localhost:3000
springdoc.api-docs.enabled=true
springdoc.swagger-ui.enabled=false

# 256-bit Base64 test secret only — never reuse outside local/CI tests.
app.auth.jwt.secret=dGVzdC1qd3Qtc2VjcmV0LWF0LWxlYXN0LTMyLWJ5dGVzLSE=
app.auth.http-enforcement-enabled=false
