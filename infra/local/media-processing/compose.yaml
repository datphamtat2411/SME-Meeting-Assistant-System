name: sme-meeting-media-local

services:
  rustfs-permissions:
    image: alpine:3.22
    user: root
    command: ["chown", "-R", "10001:10001", "/data"]
    volumes:
      - rustfs_data:/data
    restart: "no"

  rustfs:
    image: rustfs/rustfs:1.0.3
    depends_on:
      rustfs-permissions:
        condition: service_completed_successfully
    restart: unless-stopped
    environment:
      RUSTFS_ADDRESS: ":9000"
      RUSTFS_ACCESS_KEY: ${RUSTFS_ACCESS_KEY:-media-dev}
      RUSTFS_SECRET_KEY: ${RUSTFS_SECRET_KEY:-media-dev-password}
      RUSTFS_CONSOLE_ENABLE: "true"
    command: ["/data"]
    ports:
      - "127.0.0.1:9000:9000"
      - "127.0.0.1:9001:9001"
    volumes:
      - rustfs_data:/data

  rabbitmq:
    image: rabbitmq:4.1-management
    restart: unless-stopped
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USERNAME:-media-dev}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:-media-dev-password}
    ports:
      - "127.0.0.1:5672:5672"
      - "127.0.0.1:15672:15672"
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 5s
      timeout: 5s
      retries: 20

volumes:
  rustfs_data:
  rabbitmq_data:
