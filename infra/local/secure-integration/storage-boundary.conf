# RustFS 1.0.3 rejects s3:if-none-match policy conditions. This narrow HTTPS
# boundary enforces the missing rule; RustFS itself atomically evaluates the PUT.
# Backend is on a separate internal network, with no host-published port.
pid /tmp/nginx.pid;
# Routine Nginx request errors include private object URIs; never emit those.
error_log /dev/stderr emerg;
events { worker_connections 128; }
http {
    access_log off;
    client_body_temp_path /tmp/client_body;
    proxy_temp_path /tmp/proxy;
    fastcgi_temp_path /tmp/fastcgi;
    uwsgi_temp_path /tmp/uwsgi;
    scgi_temp_path /tmp/scgi;
    client_max_body_size 512m;
    # Reject ambiguous raw paths before normalized URI classification. Canonical
    # Core keys are UUID-based ASCII; signed query strings remain untouched.
    map $request_uri $ambiguous_path {
        default 0;
        ~^[^?]*% 1;
        ~^[^?]*// 1;
        ~^[^?]*/\.\.?(?:/|\?|$) 1;
    }
    map $uri $corrected_result {
        default 0;
        ~^/[^/]+/processing/[^/]+/(transcription|diarization)/results/ 1;
    }
    map "$corrected_result:$request_method:$http_if_none_match:$args:$http_x_amz_copy_source" $deny_result_mutation {
        default 0;
        # Result objects have only GET/HEAD and one atomic, non-copy, non-multipart PUT.
        ~^1:(GET|HEAD): 0;
        "1:PUT:*::" 0;
        ~^1: 1;
    }
    # No destructive source/result deletion on the workload endpoint.
    map "$request_method:$uri" $deny_protected_delete {
        default 0;
        ~^DELETE:/[^/]+/(processing/[^/]+/(transcription|diarization)/results/|meetings/[^/]+/sources/) 1;
    }
    server {
        listen 9000 ssl;
        server_name storage.internal;
        ssl_certificate /run/secrets/storage/rustfs_cert.pem;
        ssl_certificate_key /run/secrets/storage/rustfs_key.pem;
        ssl_protocols TLSv1.2 TLSv1.3;
        # A final denial can precede an Expect: 100-continue body. Do not reuse
        # that connection while discarding a body the S3 client need not send.
        error_page 403 = @s3_denied;
        location @s3_denied {
            default_type application/xml;
            keepalive_timeout 0;
            return 403 '<Error><Code>AccessDenied</Code><Message>Access denied.</Message></Error>';
        }
        # Only path-style S3 is supported; reject virtual-host namespace bypasses.
        if ($host != storage.internal) { return 403; }
        if ($ambiguous_path) { return 403; }
        if ($deny_result_mutation) { return 403; }
        if ($deny_protected_delete) { return 403; }
        location / {
            proxy_pass https://storage:9000;
            proxy_set_header Host $http_host;
            proxy_http_version 1.1;
            proxy_intercept_errors on;
            proxy_request_buffering off;
            proxy_buffering off;
            proxy_ssl_verify on;
            proxy_ssl_trusted_certificate /run/secrets/storage/issuer-ca.crt;
            proxy_ssl_server_name on;
            proxy_ssl_name storage.internal;
            proxy_connect_timeout 3s;
            proxy_read_timeout 300s;
        }
    }
}
