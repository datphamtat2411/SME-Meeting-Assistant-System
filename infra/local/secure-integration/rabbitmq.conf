# Separate opt-in broker. No plaintext AMQP or management listener.
listeners.tcp = none
listeners.ssl.default = 5671
ssl_options.certfile = /run/secrets/broker/tls.crt
ssl_options.keyfile = /run/secrets/broker/tls.key
ssl_options.cacertfile = /run/secrets/broker/issuer-ca.crt
ssl_options.versions.1 = tlsv1.3
ssl_options.versions.2 = tlsv1.2
# Broker authentication is separate per-service username/password over verified TLS.
# HTTP mTLS workload keys are never mounted into the broker.
ssl_options.verify = verify_peer
ssl_options.fail_if_no_peer_cert = false
# enabled_plugins is explicitly empty; no management HTTP listener is started.
loopback_users.guest = true
