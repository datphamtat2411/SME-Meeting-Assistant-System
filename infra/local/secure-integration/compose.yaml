name: sme-meeting-secure-integration

# Separate project and volumes; never overlay/recreate the plaintext local project.
services:
  rabbitmq:
    image: rabbitmq:4.1-management
    restart: unless-stopped
    environment:
      RABBITMQ_DEFAULT_USER: "${RABBITMQ_DEFAULT_USER:?RabbitMQ bootstrap user required}"
      RABBITMQ_DEFAULT_PASS: "${RABBITMQ_DEFAULT_PASS:?RabbitMQ bootstrap password required}"
      RABBITMQ_DEFAULT_VHOST: "${RABBITMQ_DEFAULT_VHOST:?RabbitMQ bootstrap vhost required}"
    volumes:
      - type: bind
        source: ./rabbitmq.conf
        target: /etc/rabbitmq/rabbitmq.conf
        read_only: true
      - type: bind
        source: ./enabled_plugins
        target: /etc/rabbitmq/enabled_plugins
        read_only: true
      - type: bind
        source: ${BROKER_TLS_DIR:?external broker TLS directory required}
        target: /run/secrets/broker
        read_only: true
        bind: {create_host_path: false}
      - broker_secure_data:/var/lib/rabbitmq
    ports: ["127.0.0.1:5671:5671"]
    networks:
      integration:
        aliases: ["${BROKER_DNS:-rabbitmq.internal}"]
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "check_port_connectivity"]
      interval: 10s
      timeout: 5s
      retries: 12

  storage-permissions:
    image: alpine:3.22
    user: root
    command: ["chown", "10001:10001", "/data"]
    volumes: ["storage_secure_data:/data"]
    restart: "no"
  storage:
    image: rustfs/rustfs:1.0.3
    depends_on:
      storage-permissions: {condition: service_completed_successfully}
    restart: unless-stopped
    environment:
      RUSTFS_ACCESS_KEY: "${RUSTFS_ACCESS_KEY:?RustFS bootstrap access key required}"
      RUSTFS_SECRET_KEY: "${RUSTFS_SECRET_KEY:?RustFS bootstrap secret required}"
      RUSTFS_ADDRESS: ":9000"
      RUSTFS_CONSOLE_ENABLE: "false"
      RUSTFS_TLS_PATH: /run/secrets/storage
    command: ["/data"]
    volumes:
      - storage_secure_data:/data
      - type: bind
        source: ${STORAGE_TLS_DIR:?external storage TLS directory required}
        target: /run/secrets/storage
        read_only: true
        bind: {create_host_path: false}
    networks:
      storage-backend:
        aliases: ["${STORAGE_DNS:-storage.internal}"]
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "--show-error", "--cacert", "/run/secrets/storage/issuer-ca.crt", "https://${STORAGE_DNS:-storage.internal}:9000/health"]
      interval: 10s
      timeout: 5s
      retries: 12

  storage-boundary:
    image: nginx:1.28-alpine
    user: "10001:10001"
    entrypoint: ["nginx", "-c", "/etc/nginx/storage-boundary.conf", "-g", "daemon off;"]
    depends_on:
      storage: {condition: service_healthy}
    restart: unless-stopped
    ports: ["127.0.0.1:9443:9000"]
    volumes:
      - ./storage-boundary.conf:/etc/nginx/storage-boundary.conf:ro
      - type: bind
        source: ${STORAGE_TLS_DIR:?external storage TLS directory required}
        target: /run/secrets/storage
        read_only: true
        bind: {create_host_path: false}
    networks:
      integration:
        aliases: ["${STORAGE_DNS:-storage.internal}"]
      storage-backend: {}
    read_only: true
    tmpfs: ["/tmp:mode=1777,size=32m"]
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]

  # Qdrant is started only when the Knowledge worker is explicitly selected.
  # It has its own operator-provided TLS directory and volume; it is never
  # coupled to the PI-05 project.
  qdrant:
    profiles: ["knowledge"]
    image: qdrant/qdrant:v1.20.0
    restart: unless-stopped
    environment:
      QDRANT__SERVICE__ENABLE_TLS: "true"
      QDRANT__SERVICE__API_KEY: "${QDRANT_API_KEY:-}"
      QDRANT__TLS__CERT: /run/secrets/qdrant/tls.crt
      QDRANT__TLS__KEY: /run/secrets/qdrant/tls.key
      QDRANT__STORAGE__SNAPSHOTS_PATH: /qdrant/storage/snapshots
    entrypoint: ["/bin/bash", "-ec"]
    command:
      - |
        if [ -z "$${QDRANT__SERVICE__API_KEY:-}" ]; then
          echo "Qdrant API key is required" >&2
          exit 1
        fi
        exec /qdrant/entrypoint.sh
    volumes:
      - qdrant_secure_data:/qdrant/storage
      - type: bind
        source: ${QDRANT_TLS_DIR:-/dev/null}
        target: /run/secrets/qdrant
        read_only: true
        bind: {create_host_path: false}
    ports: ["127.0.0.1:${QDRANT_PORT:-6333}:6333"]
    networks: [integration]
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "curl --fail --silent --show-error --cacert /run/secrets/qdrant/issuer-ca.crt https://127.0.0.1:6333/health",
        ]
      interval: 10s
      timeout: 5s
      retries: 12
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]

  ai-core:
    profiles: ["http"]
    build: ../../../services/ai
    image: sme-ai-core:secure-integration
    restart: unless-stopped
    env_file: ["${AI_HTTP_ENV_FILE:?generated AI HTTP environment required}"]
    environment:
      AI_HTTP_HOST: 0.0.0.0
      AI_HTTP_PORT: "8000"
      AI_TLS_CERT_FILE: /run/secrets/ai-core/ai-server.crt
      AI_TLS_KEY_FILE: /run/secrets/ai-core/ai-server.key
      AI_TLS_CLIENT_CA_FILE: /run/secrets/ai-core/client-ca.crt
    volumes:
      - type: bind
        source: ${AI_TLS_DIR:?existing AI runtime TLS directory required}
        target: /run/secrets/ai-core
        read_only: true
        bind: {create_host_path: false}
    ports: ["127.0.0.1:8444:8000"]
    networks:
      integration:
        aliases: ["${AI_DNS:?preserve actual enrolled AI server DNS SAN}"]
    read_only: true
    tmpfs: ["/tmp:mode=1777,size=64m"]
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]

  # SDK/verified TLS health checks run without mounting any server private keys.
  transport-health:
    profiles: ["checks"]
    image: sme-ai-core:secure-integration
    entrypoint: ["python", "/checks/smoke.py", "--infrastructure"]
    env_file: ["${AI_TRANSCRIPTION_ENV_FILE:?generated transcription environment required}"]
    environment:
      E2E01_STORAGE_PROBE_KEY: "${E2E01_STORAGE_PROBE_KEY:?synthetic probe key required}"
      AI_CORE_API_CONNECT_HOST: ""
      AI_CORE_API_SERVER_CA_FILE: /run/secrets/ai-worker/core-server-ca.crt
      AI_CORE_API_CLIENT_CERT_FILE: /run/secrets/ai-worker/tls.crt
      AI_CORE_API_CLIENT_KEY_FILE: /run/secrets/ai-worker/tls.key
      AI_RABBITMQ_CONNECT_HOST: ""
      AI_RABBITMQ_CA_FILE: /run/secrets/ai-worker/broker-ca.crt
      AI_S3_ENDPOINT_URL: "https://${STORAGE_DNS:-storage.internal}:9000"
      AI_S3_CONNECT_HOST: ""
      AI_S3_CA_FILE: /run/secrets/ai-worker/storage-ca.crt
    volumes:
      - type: bind
        source: ./smoke.py
        target: /checks/smoke.py
        read_only: true
      - type: bind
        source: ${WORKER_TLS_DIR:?external worker TLS/trust directory required}
        target: /run/secrets/ai-worker
        read_only: true
        bind: {create_host_path: false}
    networks: [integration]
    read_only: true
    tmpfs: ["/tmp:mode=1777,size=64m"]
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]

networks:
  integration: {}
  storage-backend:
    internal: true
volumes:
  broker_secure_data:
  storage_secure_data:
  qdrant_secure_data:
